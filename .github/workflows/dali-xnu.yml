name: Dali source XNU

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dali-xnu.yml'
      - 'board.toml'
      - 'configs/**'
      - 'drivers/**'
      - 'package/**'
      - 'patches/**'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      validation_profile:
        description: Qualification target; iPadOS audit profiles build only and emit no device artifact
        type: choice
        options: [reset-qualification, pid1, ipados-root-compile, ipados-root-policy-compile, ipados-donor-runtime-audit]
        default: reset-qualification
      auto_fastboot:
        description: Arm the default one-shot bootloader recovery watchdog
        type: boolean
        required: true
        default: true
      fastboot_timeout_seconds:
        description: Host wait deadline for the device to enumerate fastboot (not the device watchdog)
        type: number
        required: true
        default: 120
      watchdog_timeout_seconds:
        description: MT6991 single-shot watchdog interval, from 2 to 31 seconds
        type: number
        required: true
        default: 31

permissions:
  contents: read

concurrency:
  group: dali-xnu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      UNIXNU_OUT: ${{ github.workspace }}/UniXNU/out
      JOBS: '4'
      VALIDATION_PROFILE: ${{ inputs.validation_profile || 'reset-qualification' }}
    steps:
      - name: Checkout device repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: UniXNU-Dali
          persist-credentials: false

      - name: Resolve pinned source revisions
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/UniXNU-Dali/board.toml" >> "$GITHUB_OUTPUT" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as source:
              firmware = tomllib.load(source).get("firmware", {})
          for key in ("unixnu_commit", "uefi_commit"):
              value = firmware.get(key, "")
              if len(value) != 40 or any(ch not in "0123456789abcdef" for ch in value):
                  raise SystemExit(f"board.toml firmware.{key} must pin a full lowercase commit")
              print(f"{key}={value}")
          PY

      - name: Checkout generic UniXNU and pinned drivers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: localhosts-A/UniXNU
          ref: ${{ steps.pins.outputs.unixnu_commit }}
          path: UniXNU
          submodules: recursive
          persist-credentials: false

      - name: Checkout pinned UEFI payload verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: localhosts-A/UEFI-Dali
          ref: ${{ steps.pins.outputs.uefi_commit }}
          path: UEFI-Dali
          persist-credentials: false

      - name: Test combined firmware/XNU UFS package contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/UEFI-Dali/tools/dali" -p 'test_xnu_ufs_package.py' -v

      - name: Test UniXNU build driver
        shell: bash
        run: |
          set -euo pipefail
          cd UniXNU
          python3 -m unittest discover -s tests/unixnu -v

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          grep -Fqx 'Xcode 26.6' <<< "$xcode_version"

      - name: Install build and QEMU tools
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja unifdef llvm lld qemu openssl@3
          printf '%s\n' "$(brew --prefix llvm)/bin" "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Test portable UFS commands against the QEMU model
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/UniXNU/scripts/test-ufs-transport-qemu.py" \
            --output "$RUNNER_TEMP/dali-ufs-transport-qemu"

      - name: Upload portable UFS command evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dali-ufs-transport-qemu
          path: |
            ${{ runner.temp }}/dali-ufs-transport-qemu/report.json
            ${{ runner.temp }}/dali-ufs-transport-qemu/qemu.log
            ${{ runner.temp }}/dali-ufs-transport-qemu/disk.raw
            ${{ runner.temp }}/dali-ufs-transport-qemu/transport.so
            ${{ runner.temp }}/dali-ufs-transport-qemu/sources
          if-no-files-found: warn
          retention-days: 1

      - name: Test device runner and actual XNU entry instructions
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/UniXNU-Dali/tests" -v

      - name: Fingerprint source graph and installed toolchain
        id: cache_inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/UniXNU-Dali/scripts/kernel-cache-key.py" \
            --unixnu "$GITHUB_WORKSPACE/UniXNU" \
            --device "$GITHUB_WORKSPACE/UniXNU-Dali" \
            --profile "$VALIDATION_PROFILE" >> "$GITHUB_OUTPUT"

      - name: Restore pinned feed and BaseTools cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: UniXNU/out/feeds
          key: dali-feeds-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_inputs.outputs.feeds }}

      - name: Restore exact-pinned iPadOS component cache
        if: env.VALIDATION_PROFILE == 'ipados-root-policy-compile' || env.VALIDATION_PROFILE == 'ipados-donor-runtime-audit'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: UniXNU/out/ipsw
          key: dali-ipsw-v1-${{ runner.os }}-${{ hashFiles('UniXNU-Dali/board.toml') }}

      - name: Restore exact-input source kernel cache
        if: env.VALIDATION_PROFILE != 'ipados-root-policy-compile'
        id: kernel_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: |
            UniXNU/out/dali/tree/.cache
            UniXNU/out/dali/tree/build/xnu
          key: dali-kernel-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_inputs.outputs.kernel }}

      - name: Restore independent EFI package cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.0
        with:
          path: UniXNU/out/dali/package
          key: dali-edk-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_inputs.outputs.edk }}

      - name: Select the Dali compile-only iPadOS profile
        shell: bash
        run: |
          set -euo pipefail
          cd UniXNU
          defconfig="$(python3 - "$GITHUB_WORKSPACE/UniXNU-Dali/board.toml" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as source:
              board = tomllib.load(source)
          profile = __import__("os").environ.get("VALIDATION_PROFILE", "")
          if profile == "ipados-root-compile":
              defconfig = "dali_ipados_root_defconfig"
          elif profile == "ipados-root-policy-compile":
              defconfig = "dali_ipados_root_boot_defconfig"
          elif profile == "ipados-donor-runtime-audit":
              defconfig = "dali_ipados_donor_runtime_defconfig"
          else:
              defconfig = board["kernel"]["defconfig"]
          print(defconfig)
          PY
          )"
          ./unixnu defconfig -D "$GITHUB_WORKSPACE/UniXNU-Dali" "$defconfig"

      - name: Build pinned OS and SystemOS root windows
        if: env.VALIDATION_PROFILE == 'ipados-root-policy-compile'
        shell: bash
        run: |
          set -euo pipefail
          cd UniXNU
          ./unixnu build userdata -D "$GITHUB_WORKSPACE/UniXNU-Dali" -j "$JOBS"

      - name: Fetch exact 21H461 original trust-cache components
        if: env.VALIDATION_PROFILE == 'ipados-root-policy-compile'
        shell: bash
        run: |
          set -euo pipefail
          cd UniXNU
          cache_dir="$UNIXNU_OUT/ipsw/21H461"
          rm -f "$cache_dir/044-76040-038.dmg.trustcache" \
                "$cache_dir/044-76040-038.dmg.trustcache.json" \
                "$cache_dir/044-76034-038.dmg.trustcache" \
                "$cache_dir/044-76034-038.dmg.trustcache.json"
          ./unixnu ipsw -D "$GITHUB_WORKSPACE/UniXNU-Dali" fetch StaticTrustCache Cryptex1,SystemTrustCache

      - name: Assemble and validate the pinned DarwinBoot trust-cache bundle
        if: env.VALIDATION_PROFILE == 'ipados-root-policy-compile'
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/UniXNU-Dali/scripts/build-dali-ipados-trust-cache.py" \
            --static-trust-cache "$UNIXNU_OUT/ipsw/21H461/044-76040-038.dmg.trustcache" \
            --system-trust-cache "$UNIXNU_OUT/ipsw/21H461/044-76034-038.dmg.trustcache" \
            --output-dir "$UNIXNU_OUT/dali/ipados-trust-cache"

      - name: Build metadata-preserving skip-setup Data seed candidate
        if: env.VALIDATION_PROFILE == 'ipados-root-policy-compile'
        shell: bash
        run: |
          set -euo pipefail
          os_dmg="$UNIXNU_OUT/ipsw/21H461/044-76040-038.dmg"
          mount_point="$RUNNER_TEMP/dali-21h461-os"
          seed_output="$RUNNER_TEMP/dali-ipados-data-seed"
          python3_path="$(command -v python3)"
          mkdir -p "$mount_point"
          trap 'sudo hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT
          sudo hdiutil attach -readonly -nobrowse -owners on -mountpoint "$mount_point" "$os_dmg"
          sudo env PYTHONDONTWRITEBYTECODE=1 "$python3_path" "$GITHUB_WORKSPACE/UniXNU-Dali/scripts/build-dali-ipados-data-seed.py" \
            --os-root "$mount_point" \
            --os-dmg "$os_dmg" \
            --output-dir "$seed_output" \
            --unixnu "$GITHUB_WORKSPACE/UniXNU"

      - name: Create per-build VerifiedRoot signing input
        if: env.VALIDATION_PROFILE == 'ipados-root-policy-compile'
        shell: bash
        run: |
          set -euo pipefail
          key_dir="$UNIXNU_OUT/dali/tree/build/dali-verified-root/keys"
          mkdir -p "$key_dir"
          openssl genrsa -out "$key_dir/owner.pem" 3072
          openssl rsa -in "$key_dir/owner.pem" -pubout -out "$key_dir/owner-public.pem"
          chmod 600 "$key_dir/owner.pem"

      - name: Build and validate source-only XNU
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_CACHE_HIT: ${{ steps.kernel_cache.outputs.cache-hit }}
          KERNEL_INPUT_KEY: ${{ steps.cache_inputs.outputs.kernel }}
          UNIXNU_SOURCE_ROOT: ${{ github.workspace }}/UniXNU
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cd UniXNU
          cache_script="$GITHUB_WORKSPACE/UniXNU-Dali/scripts/source-kernel-cache.py"
          if [[ "$KERNEL_CACHE_HIT" == true ]] && \
              python3 "$cache_script" verify --tree "$UNIXNU_OUT/dali/tree" --key "$KERNEL_INPUT_KEY" --profile "$VALIDATION_PROFILE"; then
            echo "Reusing SHA-256-verified source XNU for identical sources and toolchain; QEMU validation follows."
          else
            ./unixnu build kernel --source-only -D "$GITHUB_WORKSPACE/UniXNU-Dali" -j "$JOBS"
            python3 "$cache_script" record --tree "$UNIXNU_OUT/dali/tree" --key "$KERNEL_INPUT_KEY" --profile "$VALIDATION_PROFILE"
          fi

      - name: Audit pinned 21H461 prelink candidate
        if: env.VALIDATION_PROFILE == 'ipados-root-policy-compile' || env.VALIDATION_PROFILE == 'ipados-donor-runtime-audit'
        shell: bash
        run: |
          set -euo pipefail
          cd UniXNU
          if [[ "$VALIDATION_PROFILE" == ipados-donor-runtime-audit ]]; then
            ./unixnu build prelink --prelink-profile donor-runtime-audit -D "$GITHUB_WORKSPACE/UniXNU-Dali" -j "$JOBS"
          else
            ./unixnu build prelink -D "$GITHUB_WORKSPACE/UniXNU-Dali" -j "$JOBS"
          fi

      - name: Show XNU build diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -u
          for log in "$UNIXNU_OUT"/dali/logs/kernel-bootstrap.log "$UNIXNU_OUT"/dali/logs/archive-*.log "$UNIXNU_OUT"/dali/logs/kernel.log "$UNIXNU_OUT"/dali/logs/prelink.log "$UNIXNU_OUT"/dali/logs/source-storage-link.log "$UNIXNU_OUT"/dali/tree/build/source-storage/*.log; do
            [[ -f "$log" ]] || continue
            printf '\n===== %s (last 100 lines) =====\n' "$log"
            tail -n 100 "$log"
          done

      - name: Upload bounded source storage build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dali-source-storage-evidence
          path: |
            UniXNU/out/dali/tree/build/source-storage/*.json
            UniXNU/out/dali/tree/build/source-storage/*.log
            UniXNU/out/dali/tree/build/source-storage/*symbols.txt
            UniXNU/out/dali/tree/build/source-storage/libIOStorageFamily.a
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Dali UFS platform compile evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dali-ufs-platform-evidence
          path: |
            UniXNU/out/dali/tree/build/dali-xnu-platform/build-report.json
            UniXNU/out/dali/tree/build/dali-xnu-platform/DaliUfs*.o
            UniXNU/out/dali/tree/build/dali-xnu-platform/DaliUfs*.o.log
            UniXNU/out/dali/tree/build/dali-xnu-platform/libDaliUfs.a
            UniXNU/out/dali/tree/build/dali-xnu-platform/dali-ufs-symbols.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Upload bounded iPadOS root-policy and Data seed evidence
        if: always() && env.VALIDATION_PROFILE == 'ipados-root-policy-compile'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dali-ipados-root-inputs
          path: |
            ${{ runner.temp }}/dali-ipados-data-seed/seed-candidate.json
            ${{ runner.temp }}/dali-ipados-data-seed/base/seed.json
            ${{ runner.temp }}/dali-ipados-data-seed/data-seed-skip-setup.json
            ${{ runner.temp }}/dali-ipados-data-seed/data-seed-skip-setup.dbr
            UniXNU/out/dali/userdata/userdata-root.json
            UniXNU/out/dali/tree/build/dali-verified-root/build-report.json
            UniXNU/out/dali/tree/build/dali-verified-root/libVerifiedRootDali.a
            UniXNU/out/dali/ipados-trust-cache/trust-cache.bundle
            UniXNU/out/dali/ipados-trust-cache/trust-cache.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload non-loadable prelink audit candidate
        if: always() && (env.VALIDATION_PROFILE == 'ipados-root-policy-compile' || env.VALIDATION_PROFILE == 'ipados-donor-runtime-audit')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dali-ipados-prelink-audit-not-for-device
          path: |
            UniXNU/out/dali/kernel/kernel.macho
            UniXNU/out/dali/kernel/kernel.json
            UniXNU/out/dali/kernel/kernel.verification.json
            UniXNU/out/dali/logs/prelink.log
            UniXNU/out/dali/logs/prelink-verification.log
          if-no-files-found: warn
          retention-days: 1

      - name: Release audited raw root image before firmware/QEMU builds
        if: env.VALIDATION_PROFILE == 'ipados-root-policy-compile'
        shell: bash
        run: |
          set -euo pipefail
          image="$UNIXNU_OUT/dali/userdata/userdata-root.img"
          test -f "$image"
          du -h "$image"
          rm -f "$image"
          test ! -e "$image"
          df -h "$GITHUB_WORKSPACE"

      - name: Build UniXNU package and locate pinned Mu BaseCore
        shell: bash
        run: |
          set -euo pipefail
          cd UniXNU
          ./unixnu build package -D "$GITHUB_WORKSPACE/UniXNU-Dali" -j "$JOBS"
          EDK2=$(find "$UNIXNU_OUT/feeds" -maxdepth 1 -type d -name 'mu_basecore-*' -print -quit)
          test -n "$EDK2"
          echo "UNIXNU_EDK2=$EDK2" >> "$GITHUB_ENV"

      - name: Build DarwinBoot
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          build_root="$GITHUB_WORKSPACE/UniXNU/build"
          if [[ -d "$build_root" ]]; then
            test ! -L "$build_root"
            ls -ldeO "$build_root"
            sudo chown -R "$(id -u):$(id -g)" "$build_root"
          fi
          output_dir="$GITHUB_WORKSPACE/UniXNU/build/DarwinBoot/DEBUG_CLANGPDB/AARCH64"
          mkdir -p "$output_dir"
          test -d "$output_dir"
          test -w "$output_dir"
          ls -ld "$output_dir"
          cd UniXNU
          bash scripts/build-darwinboot.sh

      - name: Probe non-loadable 21H461 prelink candidate in QEMU
        if: env.VALIDATION_PROFILE == 'ipados-root-policy-compile'
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/UniXNU-Dali/scripts/test-dali-xnu-qemu.py" \
            --unixnu "$GITHUB_WORKSPACE/UniXNU" \
            --kernel "$UNIXNU_OUT/dali/kernel/kernel.macho" \
            --prelink-report "$UNIXNU_OUT/dali/kernel/kernel.json" \
            --prelink-verification "$UNIXNU_OUT/dali/kernel/kernel.verification.json" \
            --config "$UNIXNU_OUT/dali/.config" \
            --trust-cache "$UNIXNU_OUT/dali/ipados-trust-cache/trust-cache.bundle" \
            --uefi-efi "$UNIXNU_OUT/dali/package/Build/Out/AARCH64-DEBUG/UniXNU.efi" \
            --output-dir "$RUNNER_TEMP/dali-ipados-prelink-qemu"

      - name: Probe donor IOStorageFamily runtime metaclasses in QEMU
        if: env.VALIDATION_PROFILE == 'ipados-donor-runtime-audit'
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/UniXNU-Dali/scripts/test-dali-xnu-qemu.py" \
            --unixnu "$GITHUB_WORKSPACE/UniXNU" \
            --kernel "$UNIXNU_OUT/dali/kernel/kernel.macho" \
            --prelink-report "$UNIXNU_OUT/dali/kernel/kernel.json" \
            --prelink-verification "$UNIXNU_OUT/dali/kernel/kernel.verification.json" \
            --native-kernel "$UNIXNU_OUT/dali/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf" \
            --config "$UNIXNU_OUT/dali/.config" \
            --donor-runtime-audit \
            --uefi-efi "$UNIXNU_OUT/dali/package/Build/Out/AARCH64-DEBUG/UniXNU.efi" \
            --output-dir "$RUNNER_TEMP/dali-ipados-donor-runtime-qemu"

      - name: Upload donor runtime audit diagnostics
        if: always() && env.VALIDATION_PROFILE == 'ipados-donor-runtime-audit'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dali-ipados-donor-runtime-audit-not-for-device
          path: |
            ${{ runner.temp }}/dali-ipados-donor-runtime-qemu/summary.json
            ${{ runner.temp }}/dali-ipados-donor-runtime-qemu/*.log
            ${{ runner.temp }}/dali-ipados-donor-runtime-qemu/*/gdb-stop.json
            ${{ runner.temp }}/dali-ipados-donor-runtime-qemu/*/gdb-uart.log
            ${{ runner.temp }}/dali-ipados-donor-runtime-qemu/*/gdb-stderr.log
          if-no-files-found: warn
          retention-days: 1

      - name: Upload non-loadable prelink QEMU diagnostics
        if: always() && env.VALIDATION_PROFILE == 'ipados-root-policy-compile'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dali-ipados-prelink-qemu-not-for-device
          path: |
            UniXNU/out/dali/kernel/kernel.macho
            UniXNU/out/dali/kernel/kernel.json
            UniXNU/out/dali/kernel/kernel.verification.json
            UniXNU/out/dali/.config
            UniXNU/out/dali/ipados-trust-cache/trust-cache.bundle
            UniXNU/out/dali/package/Build/Out/AARCH64-DEBUG/UniXNU.efi
            UniXNU/build/DarwinBoot/DEBUG_CLANGPDB/AARCH64/DarwinBoot.efi
            ${{ runner.temp }}/dali-ipados-prelink-qemu/summary.json
            ${{ runner.temp }}/dali-ipados-prelink-qemu/*.log
            ${{ runner.temp }}/dali-ipados-prelink-qemu/*/gdb-stop.json
            ${{ runner.temp }}/dali-ipados-prelink-qemu/*/gdb-uart.log
            ${{ runner.temp }}/dali-ipados-prelink-qemu/*/gdb-stderr.log
            ${{ runner.temp }}/dali-ipados-prelink-qemu/reset-instructions.json
          if-no-files-found: warn
          retention-days: 1

      - name: Test UniXNU to DarwinBoot handoff fixtures
        shell: bash
        run: |
          set -euo pipefail
          cd UniXNU
          python3 scripts/test-darwinboot.py \
            --uefi-efi "$UNIXNU_OUT/dali/package/Build/Out/AARCH64-DEBUG/UniXNU.efi"

      - name: Build the owned static PID1 and explicit test trust cache
        if: env.VALIDATION_PROFILE == 'pid1'
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/UniXNU/scripts/build-native-user-fixture.py" \
            --source "$GITHUB_WORKSPACE/UniXNU-Dali/drivers/DaliBootLog/pid1.S" \
            --output "$RUNNER_TEMP/dali-pid1-fixture"
          python3 "$GITHUB_WORKSPACE/UniXNU/scripts/build-native-user-fixture.py" \
            --source "$GITHUB_WORKSPACE/UniXNU-Dali/drivers/DaliBootLog/pid1.S" \
            --entitlements "$GITHUB_WORKSPACE/UniXNU-Dali/drivers/DaliBootLog/negative-entitlements.plist" \
            --output "$RUNNER_TEMP/dali-pid1-entitlement-negative"

      - name: Test one-core DarwinBoot to source XNU handoff
        if: env.VALIDATION_PROFILE != 'ipados-root-compile' && env.VALIDATION_PROFILE != 'ipados-root-policy-compile' && env.VALIDATION_PROFILE != 'ipados-donor-runtime-audit'
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/UniXNU-Dali/scripts/test-dali-xnu-qemu.py" \
            --unixnu "$GITHUB_WORKSPACE/UniXNU" \
            --kernel "$UNIXNU_OUT/dali/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf" \
            --uefi-efi "$UNIXNU_OUT/dali/package/Build/Out/AARCH64-DEBUG/UniXNU.efi" \
            --output-dir "$RUNNER_TEMP/dali-xnu-qemu"

      - name: Test actual source storage media interfaces in QEMU
        if: env.VALIDATION_PROFILE != 'ipados-root-compile' && env.VALIDATION_PROFILE != 'ipados-root-policy-compile' && env.VALIDATION_PROFILE != 'ipados-donor-runtime-audit'
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/UniXNU-Dali/scripts/test-source-storage-qemu.py" \
            --unixnu "$GITHUB_WORKSPACE/UniXNU" \
            --kernel "$UNIXNU_OUT/dali/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf" \
            --uefi-efi "$UNIXNU_OUT/dali/package/Build/Out/AARCH64-DEBUG/UniXNU.efi" \
            --output-dir "$RUNNER_TEMP/dali-source-storage-qemu"

      - name: Upload source storage QEMU evidence
        if: always() && env.VALIDATION_PROFILE != 'ipados-root-compile' && env.VALIDATION_PROFILE != 'ipados-root-policy-compile' && env.VALIDATION_PROFILE != 'ipados-donor-runtime-audit'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dali-source-storage-qemu
          path: |
            ${{ runner.temp }}/dali-source-storage-qemu/result.json
            ${{ runner.temp }}/dali-source-storage-qemu/*.log
            ${{ runner.temp }}/dali-source-storage-qemu/*/gdb-stop.json
          if-no-files-found: warn
          retention-days: 1

      - name: Test readonly RAM root, real PID1 syscalls and 30-second heartbeats
        if: env.VALIDATION_PROFILE == 'pid1'
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/UniXNU-Dali/scripts/test-dali-pid1-qemu.py" \
            --unixnu "$GITHUB_WORKSPACE/UniXNU" \
            --kernel "$UNIXNU_OUT/dali/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf" \
            --uefi-efi "$UNIXNU_OUT/dali/package/Build/Out/AARCH64-DEBUG/UniXNU.efi" \
            --fixture "$RUNNER_TEMP/dali-pid1-fixture" \
            --entitlement-negative-fixture "$RUNNER_TEMP/dali-pid1-entitlement-negative" \
            --output-dir "$RUNNER_TEMP/dali-xnu-qemu/pid1"

      - name: Upload bounded QEMU diagnostics after failure
        if: failure() && env.VALIDATION_PROFILE != 'ipados-root-compile' && env.VALIDATION_PROFILE != 'ipados-root-policy-compile' && env.VALIDATION_PROFILE != 'ipados-donor-runtime-audit'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dali-xnu-qemu-diagnostics
          path: ${{ runner.temp }}/dali-xnu-qemu
          if-no-files-found: warn
          retention-days: 1

      - name: Validate and stage the one-day kernel artifact
        if: env.VALIDATION_PROFILE != 'ipados-root-compile' && env.VALIDATION_PROFILE != 'ipados-root-policy-compile' && env.VALIDATION_PROFILE != 'ipados-donor-runtime-audit'
        id: artifact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_AUTO_FASTBOOT: ${{ inputs.auto_fastboot }}
          DISPATCH_FASTBOOT_TIMEOUT: ${{ inputs.fastboot_timeout_seconds }}
          DISPATCH_WATCHDOG_TIMEOUT: ${{ inputs.watchdog_timeout_seconds }}
        run: |
          set -euo pipefail
          auto=true
          host_timeout=120
          watchdog_timeout=31
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            auto=${DISPATCH_AUTO_FASTBOOT:-true}
            host_timeout=${DISPATCH_FASTBOOT_TIMEOUT:-120}
            watchdog_timeout=${DISPATCH_WATCHDOG_TIMEOUT:-31}
          fi
          profile_args=()
          if [[ "$VALIDATION_PROFILE" == reset-qualification ]]; then
            auto=false
            host_timeout=120
            profile_args+=(--reset-qualification)
          elif [[ "$VALIDATION_PROFILE" == pid1 ]]; then
            profile_args+=(--pid1-directory "$RUNNER_TEMP/dali-pid1-fixture")
          else
            echo "Unsupported validation profile" >&2
            exit 2
          fi
          [[ "$auto" == true || "$auto" == false ]]
          [[ "$watchdog_timeout" =~ ^[0-9]+$ ]] && (( watchdog_timeout >= 2 && watchdog_timeout <= 31 ))
          [[ "$host_timeout" =~ ^[0-9]+$ ]] && (( host_timeout >= watchdog_timeout + 30 && host_timeout <= 600 ))
          python3 "$GITHUB_WORKSPACE/UniXNU-Dali/scripts/make-kernel-artifact.py" \
            --kernel "$UNIXNU_OUT/dali/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf" \
            --output-dir "$RUNNER_TEMP/public-artifact" \
            --unixnu "$GITHUB_WORKSPACE/UniXNU" \
            --device-repo "$GITHUB_WORKSPACE/UniXNU-Dali" \
            "${profile_args[@]}" \
            --auto-fastboot "$auto" \
            --fastboot-timeout-seconds "$host_timeout" \
            --watchdog-timeout-seconds "$watchdog_timeout"

      - name: Upload source-only XNU for one day
        if: env.VALIDATION_PROFILE != 'ipados-root-compile' && env.VALIDATION_PROFILE != 'ipados-root-policy-compile' && env.VALIDATION_PROFILE != 'ipados-donor-runtime-audit'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dali-xnu-source
          path: |
            ${{ runner.temp }}/public-artifact/kernel.macho
            ${{ runner.temp }}/public-artifact/manifest.json
            ${{ runner.temp }}/public-artifact/pid1.macho
            ${{ runner.temp }}/public-artifact/pid1.trustcache
          if-no-files-found: error
          retention-days: 1
