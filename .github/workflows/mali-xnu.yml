name: Dali Mali source XNU
on:
  workflow_dispatch:
  push:
    branches: [codex/dali-mali-metal-offline]
    paths: ['.github/workflows/mali-xnu.yml', 'board.toml', 'drivers/DaliMali/**', 'configs/dali_defconfig', 'patches/xnu/dali-bootlog-personality.patch', 'scripts/build-dali-xnu-platform.py']
permissions:
  contents: read
concurrency:
  group: dali-mali-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      UNIXNU_OUT: ${{ github.workspace }}/UniXNU/out
      JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: UniXNU-Dali
          persist-credentials: false
      - name: Resolve pinned generic source
        id: pins
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          pin = tomllib.loads(Path('UniXNU-Dali/board.toml').read_text())['firmware']['unixnu_commit']
          assert len(pin) == 40 and all(c in '0123456789abcdef' for c in pin)
          print('generic=' + pin)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: localhosts-A/UniXNU
          ref: ${{ steps.pins.outputs.generic }}
          path: UniXNU
          submodules: recursive
          persist-credentials: false
      - name: Select Xcode and tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          brew install cmake ninja unifdef llvm lld
          printf '%s\n' "$(brew --prefix llvm)/bin" "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - name: Test production core and board contracts
        run: |
          python3 UniXNU/scripts/check-native-mali-host.py --sanitize
          python3 -m unittest discover -s UniXNU-Dali/tests -p 'test_*_resources.py' -v
          python3 -m unittest discover -s UniXNU-Dali/tests -p test_xnu_patches.py -v
      - name: Fingerprint build inputs
        id: cache_inputs
        run: |
          python3 UniXNU-Dali/scripts/kernel-cache-key.py --unixnu "$GITHUB_WORKSPACE/UniXNU" --device "$GITHUB_WORKSPACE/UniXNU-Dali" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: UniXNU/out/feeds
          key: dali-feeds-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_inputs.outputs.feeds }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            UniXNU/out/dali/tree/.cache
            UniXNU/out/dali/tree/build/xnu
          key: dali-mali-source-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_inputs.outputs.kernel }}
      - name: Build source XNU including NativeMali and DaliMali
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd UniXNU
          ./unixnu defconfig -D "$GITHUB_WORKSPACE/UniXNU-Dali" dali_defconfig
          ./unixnu build kernel --source-only -D "$GITHUB_WORKSPACE/UniXNU-Dali" -j "$JOBS"
      - name: Record source and kernel identity
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['UNIXNU_OUT']) / 'dali/tree'
          kernel = root / 'build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf'
          assert kernel.is_file()
          report = {'schema': 1, 'hardware_exercised': False, 'generic_commit': subprocess.check_output(['git','-C','UniXNU','rev-parse','HEAD'],text=True).strip(),
                    'device_commit': subprocess.check_output(['git','-C','UniXNU-Dali','rev-parse','HEAD'],text=True).strip(),
                    'kernel_sha256': hashlib.sha256(kernel.read_bytes()).hexdigest(), 'kernel_bytes': kernel.stat().st_size,
                    'activation_bootargs': ['dali-mali=1','maxmem=1992'], 'firmware_included': False}
          (root / 'build/dali-xnu-platform/mali-kernel-manifest.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Upload compile diagnostics and source kernel
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dali-mali-xnu-source
          path: |
            UniXNU/build/native-mali-host/report.json
            UniXNU/build/native-mali-host/*.log
            UniXNU/out/dali/logs/*.log
            UniXNU/out/dali/tree/build/dali-xnu-platform/*
            UniXNU/out/dali/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
          if-no-files-found: error
          retention-days: 1
