[bootimg.image]
header_version = 4
# Use scripts/build-firmware.sh for the reviewed legacy-LZ4/custom shim path.
# The generic UniXNU bootimg command currently assumes gzip and BootShim.S.

[kernel]
defconfig = "dali_ipados_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-libpthread-kernel.py",
  "build-mockfs-fixture.py",
  "build-source-storage.py",
  "build-dali-xnu-platform.py",
  "build-dali-verified-root.py",
]

# Audit-only input: this is the decompressed arm64 Mach-O hash, distinct from
# the compressed IPSW member hash above. NativePrelink currently reports its
# ABI, relocation and runtime gates as false; this must never imply loadability.
[kernel.prelink]
tool = "scripts/emit-source-interface-prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
# The native kernel links the pinned public IOStorageFamily classes. Keep its
# donor bundle identity/personality metadata as codeless so dependents resolve
# without registering a second IOUserBlockStorageDevice class.
source_interfaces = ["com.apple.iokit.IOStorageFamily"]
# Pinned donor disassembly at these addresses matches IOBlockStorageDevice::getProperty,
# IOMedia::{attachToChild,synchronize,D2}, IOMediaBSDClient::getProvider, and
# IOPartitionScheme::D2 in the public IOStorageFamily source pin.
# These static mappings do not qualify runtime behavior; prelink and ABI remain audit-only.
source_interface_bindings = [
  { bundle = "com.apple.iokit.IOStorageFamily", donor_va = "0xfffffff00596ee88", symbol = "__ZNK20IOBlockStorageDevice11getPropertyEPK8OSSymbol" },
  { bundle = "com.apple.iokit.IOStorageFamily", donor_va = "0xfffffff005975f0c", symbol = "__ZN7IOMediaD2Ev" },
  { bundle = "com.apple.iokit.IOStorageFamily", donor_va = "0xfffffff0059762a8", symbol = "__ZN7IOMedia13attachToChildEP15IORegistryEntryPK15IORegistryPlane" },
  { bundle = "com.apple.iokit.IOStorageFamily", donor_va = "0xfffffff005976eb0", symbol = "__ZN7IOMedia11synchronizeEP9IOServiceyyj" },
  { bundle = "com.apple.iokit.IOStorageFamily", donor_va = "0xfffffff0059795b8", symbol = "__ZNK16IOMediaBSDClient11getProviderEv" },
  { bundle = "com.apple.iokit.IOStorageFamily", donor_va = "0xfffffff00597c344", symbol = "__ZN17IOPartitionSchemeD2Ev" },
]
