"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"
"044-76040-038.dmg.trustcache" = "4563bdbf6ed8f72237d45dbba3ccde432634338f95c10d79d5d4631678a97c7c"
"044-76034-038.dmg.trustcache" = "9742f3d566369e6c48f63b3dc0740b06c243d13c6650e25bbf44616e13d6d097"

[userdata]
partition_name = "unixnu_data"
lun = 2
first_lba = 7023103
last_lba = 15403518
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[firmware]
config = "dali"
dsc = "Platforms/Xiaomi/daliPkg/dali.dsc"
fd = "Build/daliPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
unixnu_commit = "0fd17e9218d1de8d912ee6e8c05f46a7fce47b19"
uefi_commit = "0f82a6a85d28660cbaa5db662507ea2a78891c44"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Mu_Basecore", "Silicium-ACPI"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}/Platforms/Xiaomi", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/MediaTek", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/MediaTek",
  "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}",
]

[firmware.defines]
DEVICE_MODEL = "dali"

[bootimg.image]
header_version = 4
# Use scripts/build-firmware.sh for the reviewed legacy-LZ4/custom shim path.
# The generic UniXNU bootimg command currently assumes gzip and BootShim.S.

[kernel]
defconfig = "dali_ipados_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-libpthread-kernel.py",
  "build-mockfs-fixture.py",
  "build-source-storage.py",
  "build-dali-xnu-platform.py",
]

[payload]
volume = "DALI-XNU"
size_mib = 24
loader = "firmware"
title = "Dali single-core XNU early boot"
dram_size = "0x300000000"
timeout = 10
trust_cache_sha256 = ["7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7"]
skip_setup_tool = "scripts/seed-data-skip-setup.py"
skip_setup_args = ["--no-auto-dim"]
# Qualified with the source-only kernel's typed-allocation metadata. The
# upstream default exceeds kalloc's 32-zone per-size scratch array here.
kernel_args = ["-v", "dali-earlyboot=1", "kt_fixed_zones=120"]

[payload.adt]
tool = "scripts/make-dali-adt.py"
cpu_regs = "0"
psci_method = "smc"
# UUID of the exact hash-pinned donor OS volume; this identifies the mounted root, not Dali hardware.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
packed_data_ramdisk = true
