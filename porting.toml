procedure = ["Inventory MT6991 GPU, SMMU and firmware only after the first display milestone."]
findings = ["The target kernel ABI and board DMA policy remain unverified."]
completion = ["A known image renders through the target GPU path with stable mapping and fences."]
limits = ["GPU is deferred to its own plan."]
next_action = ["Keep the GPU subplan pending until the display milestone is reached."]
